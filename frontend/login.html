<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - BrainTumorAI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="logo">
            BrainTumor<span>AI</span>
        </div>

        <h2>Welcome Back</h2>

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-btn">

                Login

            </button>

        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


        <a
            href="index.html"
            class="back-home">

            ← Back to Home

        </a>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
