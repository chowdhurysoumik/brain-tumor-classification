<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - BrainTumorAI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="logo">
            BrainTumor<span>AI</span>
        </div>

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-btn">
                Register
            </button>

        </form>


        <div class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <a
            href="index.html"
            class="back-home">

            ← Back to Home

        </a>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
